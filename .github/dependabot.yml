# PRs mensuales agrupados por ecosistema: uno con minor+patch y otro con el resto (majors);
# la seguridad llega agrupada y sin esperar al mes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores:
        patterns: ["*"]
        update-types: [minor, patch]
      mayores:
        patterns: ["*"]
        update-types: [major]
      seguridad:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores:
        patterns: ["*"]
        update-types: [minor, patch]
      mayores:
        patterns: ["*"]
        update-types: [major]
      seguridad:
        applies-to: security-updates
        patterns: ["*"]
