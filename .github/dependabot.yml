# PRs mensuales agrupados por ecosistema: uno con minor+patch y otro con el resto (majors);
# la seguridad llega agrupada y sin esperar al mes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    # Versiones que fija el SDK de Expo: se suben con `npx expo install --fix`, no sueltas
    # (react-native 0.87 fuera de Expo 57 rompió la build de la APK en #11)
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@types/react"
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
    groups:
      menores:
        patterns: ["*"]
        update-types: [minor, patch]
      mayores:
        patterns: ["*"]
        update-types: [major]
      seguridad:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores:
        patterns: ["*"]
        update-types: [minor, patch]
      mayores:
        patterns: ["*"]
        update-types: [major]
      seguridad:
        applies-to: security-updates
        patterns: ["*"]
