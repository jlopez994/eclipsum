name: 💡 Proposal
description: An improvement or new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem it solves
      description: The real case, not the solution. "As a user in situation X, I'm missing Y." Spanish is welcome too.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd see it solved inside the app.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other ways to solve it and why they don't fit.
