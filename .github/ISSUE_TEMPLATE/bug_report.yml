name: 🐞 Bug
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Y qué esperabas que pasara.
      placeholder: "Al cambiar de eclipse, la totalidad más cercana muestra la del anterior…"
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir Ajustes → Próximos eclipses
        2. Elegir el de 2027-08-02
        3. Volver al mapa
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: Ajustes → Acerca de → «build N».
      placeholder: "build 22"
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y versión de Android
      placeholder: "Pixel 7 · Android 15"
    validations:
      required: true
  - type: dropdown
    id: conexion
    attributes:
      label: ¿Con o sin conexión?
      description: Buena parte de la app funciona offline — importa para reproducir.
      options:
        - Con conexión
        - Sin conexión
        - No lo sé / da igual
    validations:
      required: true
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o vídeo
      description: Arrastra aquí imágenes si ayudan.
