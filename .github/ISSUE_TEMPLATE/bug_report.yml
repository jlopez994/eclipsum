name: 🐞 Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: And what you expected to happen. Spanish is welcome too / también puedes escribir en español.
      placeholder: "After switching eclipses, the nearest totality still shows the previous one…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → Upcoming eclipses
        2. Pick the 2027-08-02 one
        3. Go back to the map
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: Settings → About → "build N".
      placeholder: "build 23"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 7 · Android 15"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Online or offline?
      description: Much of the app works offline — it matters for reproducing.
      options:
        - Online
        - Offline
        - Don't know / doesn't matter
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Drag images here if they help.
