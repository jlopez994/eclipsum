# Compila y publica la APK al llegar a main un versionCode nuevo.
# Pushear código NO despliega: el guard salta si la release b<versionCode> ya existe,
# así que desplegar = bumpear expo.android.versionCode en app.json (chore(release): build N).
#
# Estable: release b<vc> con asset de nombre fijo eclipsum.apk (la URL
#   releases/latest/download/eclipsum.apk nunca cambia) + Remote Config
#   latest_version_code=<vc> para que la app avise de la actualización.
# Beta/rc (versión contiene beta|rc): pre-release — no pisa releases/latest
#   y no toca Remote Config.
#
# Secretos requeridos (Settings → Secrets → Actions):
#   GOOGLE_SERVICES_JSON     — contenido de google-services.json (gitignorado)
#   FIREBASE_SERVICE_ACCOUNT — el mismo que usa sync-remote-config
name: release-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Versión y guard
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(node -p "require('./app.json').expo.version")"
          VC="$(node -p "require('./app.json').expo.android.versionCode")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          case "$V" in
            *beta*|*rc*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
          esac
          if gh release view "b$VC" >/dev/null 2>&1; then
            echo "b$VC ya publicada — nada que hacer"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        if: steps.v.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      # Caché de Gradle: recorta varios minutos en builds sucesivas
      - uses: gradle/actions/setup-gradle@v4
        if: steps.v.outputs.skip != 'true'

      - name: Dependencias
        if: steps.v.outputs.skip != 'true'
        run: npm ci

      # Puerta de calidad: si el motor, el catálogo o los tipos se rompen, no sale APK
      - name: Selfcheck + typecheck
        if: steps.v.outputs.skip != 'true'
        run: npm run selfcheck && npm run typecheck

      - name: google-services.json
        if: steps.v.outputs.skip != 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Compilar APK release
        if: steps.v.outputs.skip != 'true'
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease

      - name: GitHub Release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          VC="${{ steps.v.outputs.vc }}"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" eclipsum.apk
          cp "$APK" "eclipsum-$V.apk"
          FLAGS=""
          [ "${{ steps.v.outputs.prerelease }}" = "true" ] && FLAGS="--prerelease"
          gh release create "b$VC" eclipsum.apk "eclipsum-$V.apk" $FLAGS \
            --title "Eclipsum $V" \
            --notes "APK $V · descarga estable: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/eclipsum.apk"

      # Anuncia la actualización en la app vía Remote Config. Cada canal escribe SU par:
      # estable en latest_* (asset fijo de releases/latest), beta en latest_beta_* (asset
      # de su propio tag, porque una pre-release no mueve releases/latest). La app lee uno
      # u otro según el canal elegido en Ajustes, así que una beta nunca avisa a un estable.
      - name: Publicar Remote Config
        if: steps.v.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          IS_BETA: ${{ steps.v.outputs.prerelease }}
          VC: ${{ steps.v.outputs.vc }}
          REPO: ${{ github.repository }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          # El deploy sube el template ENTERO. Si estuviera desincronizado (un deploy manual
          # sin commitear), publicar una beta haría retroceder el aviso del canal estable.
          # Se leen los valores vivos y se conservan los del canal que esta build NO toca.
          npx firebase-tools@latest remoteconfig:get --project eclipsum-app-jl -o /tmp/rc-prod.json
          node -e "
            const fs = require('fs');
            const rc = JSON.parse(fs.readFileSync('remoteconfig.template.json', 'utf8'));
            const prod = JSON.parse(fs.readFileSync('/tmp/rc-prod.json', 'utf8')).parameters || {};
            const beta = process.env.IS_BETA === 'true';
            const set = (k, v) => { rc.parameters[k].defaultValue.value = v; };
            // Punto de partida: lo que hay publicado (estas cuatro claves solo las escribe este workflow)
            for (const k of ['latest_version_code', 'latest_apk_url', 'latest_beta_version_code', 'latest_beta_apk_url']) {
              const live = prod[k] && prod[k].defaultValue && prod[k].defaultValue.value;
              if (live !== undefined) set(k, live);
            }
            if (beta) {
              set('latest_beta_version_code', process.env.VC);
              set('latest_beta_apk_url',
                'https://github.com/' + process.env.REPO + '/releases/download/b' + process.env.VC + '/eclipsum.apk');
            } else {
              set('latest_version_code', process.env.VC);
            }
            fs.writeFileSync('remoteconfig.template.json', JSON.stringify(rc, null, 2) + '\n');
          "
          npx firebase-tools@latest deploy --only remoteconfig --project eclipsum-app-jl --non-interactive

      - name: Commitear template actualizado
        if: steps.v.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add remoteconfig.template.json
          git diff --cached --quiet || {
            git commit -m "chore(rc): build ${{ steps.v.outputs.vc }} [skip ci]"
            git pull --rebase
            git push
          }
